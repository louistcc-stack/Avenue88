name: Update podcasts

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-podcasts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/podcasts.json from YouTube playlists
        run: python3 scripts/update_podcasts.py

      - name: Commit data/podcasts.json if it changed
        run: |
          git add -- data/podcasts.json
          if git diff --cached --quiet -- data/podcasts.json; then
            echo "No change in data/podcasts.json; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update podcast episodes"
          git push origin HEAD
