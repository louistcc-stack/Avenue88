name: Update team stats

on:
  schedule:
    # Monday 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-team-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/stats.json from CEA public records
        run: python3 scripts/update_team_stats.py

      - name: Commit data/stats.json if it changed
        run: |
          git add -- data/stats.json
          if git diff --cached --quiet -- data/stats.json; then
            echo "No change in data/stats.json; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update CEA team stats"
          git push
